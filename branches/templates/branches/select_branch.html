<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select branch — CentCompras</title>
</head>
<body>
    <h1>Select branch</h1>
    <p>Choose which branch you are working for.</p>

    <form method="post">
        {% csrf_token %}
        {% for membership in memberships %}
            <p>
                <button type="submit" name="branch_id" value="{{ membership.branch.id }}">
                    {{ membership.branch.name }} ({{ membership.get_role_display }})
                </button>
            </p>
        {% endfor %}
    </form>
</body>
</html>
