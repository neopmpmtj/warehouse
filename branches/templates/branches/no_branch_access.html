<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No branch access — CentCompras</title>
</head>
<body>
    <h1>No branch access</h1>
    <p>Your account is not assigned to any branch yet.</p>
    <p>Ask an administrator to add a branch membership for you.</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sign out</button>
    </form>
</body>
</html>
